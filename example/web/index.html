<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A Material-free, Cupertino-free Flutter design system built on pure widgets and Dart UI.">
  <meta name="theme-color" content="#001E60">

  <!-- SEO & Social Preview -->
  <link rel="canonical" href="https://ui.layrz.com">

  <!-- Open Graph (Facebook, LinkedIn, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="layrz_ui">
  <meta property="og:title" content="layrz_ui - Flutter Design System">
  <meta property="og:description" content="A Material-free, Cupertino-free Flutter design system built on pure widgets and Dart UI.">
  <meta property="og:url" content="https://ui.layrz.com">
  <meta property="og:image" content="https://ui.layrz.com/favicon.png">
  <meta property="og:image:width" content="500">
  <meta property="og:image:height" content="500">
  <meta property="og:image:alt" content="layrz_ui logo">

  <!-- X / Twitter -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="layrz_ui - Flutter Design System">
  <meta name="twitter:description" content="A Material-free, Cupertino-free Flutter design system built on pure widgets and Dart UI.">
  <meta name="twitter:image" content="https://ui.layrz.com/favicon.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="layrz_ui">

  <!-- Icons -->
  <link rel="icon" type="image/png" href="favicon.png">
  <!-- Apple touch icon: 180×180 is the standard Apple spec size; a single 500×500 asset is being reused because it is the only icon available -->
  <link rel="apple-touch-icon" href="favicon.png">

  <title>layrz_ui showroom</title>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
