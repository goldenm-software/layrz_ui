name: example
description: Example app for layrz_ui
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  layrz_ui: any
  layrz_icons: ^1.1.1
  flutter_material_design_icons: ^3.1.0+7447
  go_router: ^14.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  layrz_ui:
    path: ../

flutter:
  fonts:
    - family: Open Sans
      fonts:
        - asset: fonts/Open-Sans.ttf
    - family: Fira Sans
      fonts:
        - asset: fonts/FiraSans-Regular.ttf
          weight: 400
        - asset: fonts/FiraSans-Light.ttf
          weight: 300
        - asset: fonts/FiraSans-Bold.ttf
          weight: 700