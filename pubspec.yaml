name: layrz_ui
description: "A Material-free and Cupertino-free Flutter design system built on package:flutter/widgets.dart. The successor to layrz_theme."
version: 1.0.0-prerelease.1
homepage: https://github.com/goldenm-software/layrz_ui
repository: https://github.com/goldenm-software/layrz_ui
issue_tracker: https://github.com/goldenm-software/layrz_ui/issues
documentation: https://github.com/goldenm-software/layrz_ui/wiki
topics:
  - design-system
  - flutter-ui
  - widgets
  - theming
  - ui

platforms:
  android:
  ios:
  linux:
  macos:
  windows:
  web:

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter: { sdk: flutter }
  flutter_svg: ^2.3.0
  flutter_material_design_icons: ^3.1.0+7447
  flutter_mdi_remap: ^1.0.0
  timezone: ^0.10.1
  web: ^1.0.0
  pointer_interceptor: ^0.10.1
  file_picker: ^12.2.0
  desktop_drop: ^0.8.4
  emojis: ^3.2.0
  sync_scroll_controller: ^1.0.1
  markdown: ^7.0.0

dev_dependencies:
  flutter_test: { sdk: flutter }
  flutter_lints: ^6.0.0
  file_picker_linux: ^1.1.0
  cross_file: ^0.3.5

flutter:
  fonts:
    - family: Noto Color Emoji
      fonts:
        - asset: assets/NotoColorEmoji-Regular.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/JetBrainsMono-VariableFont_wght.ttf
