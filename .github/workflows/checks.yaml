name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  lint-dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: goldenm-software/layrz-ci-workflows/.github/actions/check-dart@v1
        with:
          flutter-version: "3.47.0"
          run-checks: true
          run-tests: true
          artifact-name: 'dart-coverage-${{ github.run_id }}'

      - name: Check for Material/Cupertino imports
        run: |
          if grep -r "package:flutter/material\|package:flutter/cupertino" lib/; then
            echo "FAILED: Found Material or Cupertino imports in lib/"
            exit 1
          fi

      - name: Check for GoogleFonts TextTheme usage
        run: |
          if grep -r "GoogleFonts\.[a-zA-Z]*TextTheme" lib/; then
            echo "FAILED: Found GoogleFonts TextTheme calls in lib/"
            exit 1
          fi

  coverage:
    needs: [lint-dart]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download Dart coverage artifacts
        uses: actions/download-artifact@v8
        with:
          name: dart-coverage-${{ github.run_id }}
          path: dart-coverage

      - uses: goldenm-software/layrz-actions/.github/actions/coverage-comment@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          enable-dart: true
          dart-coverage-path: dart-coverage/lcov.info

      - uses: goldenm-software/layrz-actions/.github/actions/coverage-check@v1
        with:
          enable-dart: true
          dart-coverage-path: dart-coverage/lcov.info
          threshold: '90'

  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }

      - uses: goldenm-software/layrz-ci-workflows/.github/actions/changelog@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          post-comment: true
