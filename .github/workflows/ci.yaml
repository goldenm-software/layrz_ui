name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Download dependencies
        run: flutter pub get

      - name: Check for Material/Cupertino imports
        run: |
          if grep -r "package:flutter/material\|package:flutter/cupertino" lib/; then
            echo "FAILED: Found Material or Cupertino imports in lib/"
            exit 1
          fi

      - name: Check for GoogleFonts TextTheme usage
        run: |
          if grep -r "GoogleFonts\.[a-zA-Z]*TextTheme" lib/; then
            echo "FAILED: Found GoogleFonts TextTheme calls in lib/"
            exit 1
          fi

      - name: Format code check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze code
        run: flutter analyze

      - name: Check test mirror
        run: bash tool/check_test_mirror.sh

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Check coverage ratchet
        run: bash tool/check_coverage.sh
