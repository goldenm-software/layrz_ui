name: Deploy Showroom

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install boto3
        run: pip install --upgrade boto3

      - name: Download dependencies (root)
        run: flutter pub get

      - name: Download dependencies (example)
        run: flutter pub get
        working-directory: example

      - name: Build web release (WASM)
        run: flutter build web --wasm --release
        working-directory: example

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.UI_AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.UI_AWS_ACCESS_SECRET }}
          aws-region: ${{ secrets.US_AWS_REGION }}

      - name: Deploy to S3 and CloudFront
        # The deploy script logs every file with its resolved content type and cache-control;
        # that log is the forensic record when a deploy misbehaves.
        env:
          DEPLOY_BUCKET: ${{ secrets.UI_AWS_S3_BUCKET }}
          DEPLOY_DISTRIBUTION_ID: ${{ secrets.UI_AWS_CLOUDFRONT_DISTRIBUTION }}
          AWS_REGION: ${{ secrets.US_AWS_REGION }}
        run: python3 tool/deploy_web.py

      - name: Print deployed size
        run: du -sh example/build/web
